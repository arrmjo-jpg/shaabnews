name: Deploy

# Health-gated, path-filtered, sequential deployment orchestrator for the 5 independent Coolify
# Applications (see DEPLOYMENT.md §1/§7). Coolify itself has no cross-Application deploy
# sequencing — this workflow is what enforces "backend must be confirmed healthy before frontend
# build starts" from outside, since that dependency can no longer be expressed inside a single
# docker-compose.yml after the Option A+ split.
#
# ⚠️ Phase F state: the Coolify API shape used by coolify-deploy.sh is now verified against this
# server's actual running Coolify 4.1.2 source (read-only `docker exec coolify cat ...`, no
# changes made) — see that script's header comment. Still no real secrets/App UUIDs wired in here
# yet, because the 5 Applications themselves don't exist yet — this file defines the pipeline
# *shape* for review; it stays inert until Phase F creates the Applications and their tokens.
#
# Required repo secrets once real (not set yet):
#   COOLIFY_API_URL, COOLIFY_API_TOKEN
#   COOLIFY_BACKEND_APP_UUID, COOLIFY_WORKERS_APP_UUID
#   COOLIFY_FRONTEND_APP_UUID, COOLIFY_ADMIN_APP_UUID

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      admin: ${{ steps.filter.outputs.admin }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # يطابق تمامًا قائمة COPY الصريحة في docker/php/Dockerfile — أي مسار يدخل فعليًّا في
          # صورة backend/workers مُدرَج هنا، لا أكثر ولا أقل (لا تخمين، تحقّق مباشر من الـDockerfile).
          filters: |
            backend:
              - 'app/**'
              - 'bootstrap/**'
              - 'config/**'
              - 'database/**'
              - 'lang/**'
              - 'public/**'
              - 'resources/**'
              - 'routes/**'
              - 'artisan'
              - 'composer.json'
              - 'composer.lock'
              - 'docker/php/**'
              - 'docker-compose.backend.yml'
              - 'docker-compose.workers.yml'
            frontend:
              - 'frontend/**'
              - 'docker-compose.frontend.yml'
            admin:
              - 'admin-frontend/**'
              - 'docker-compose.admin.yml'

  deploy-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy backend, wait for actual deployment success
        run: bash .github/scripts/coolify-deploy.sh "${{ secrets.COOLIFY_BACKEND_APP_UUID }}"

      # طبقة تأكيد إضافية بعد تأكيد نجاح النشر نفسه (لا بديلاً عنه) — يتحقّق أن /up يستجيب فعلاً
      # من النسخة التي أنهت النشر للتوّ، لا يعتمد عليه وحده لمعرفة أن النشر نجح.
      - name: Confirm backend responds healthy post-deploy
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://api.harer.store/up)
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "Backend deployed but /up never returned 200" >&2
          exit 1

      # نفس الالتزام (github.sha)، نفس الـDockerfile، نفس ARG GIT_SHA — يُنشَر فقط بعد تأكيد نجاح
      # backend كي لا نُبقي workers على نسخة أحدث من backend نفسه أو العكس.
      - name: Deploy workers, wait for actual deployment success
        run: bash .github/scripts/coolify-deploy.sh "${{ secrets.COOLIFY_WORKERS_APP_UUID }}"

  deploy-frontend:
    needs: [changes, deploy-backend]
    # always() ضروريّ: deploy-backend يُتخطَّى (skip) إن لم يتغيّر شيء في backend، والتخطّي
    # الافتراضيّ لـGitHub Actions كان سيمنع هذه الخطوة من العمل أصلاً بدونها.
    if: |
      always() &&
      (needs.changes.outputs.frontend == 'true' || needs.deploy-backend.result == 'success') &&
      needs.deploy-backend.result != 'failure'
    runs-on: ubuntu-latest
    env:
      COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify backend healthy before starting frontend build
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://api.harer.store/up)
          [ "$code" = "200" ] || { echo "Backend not healthy — refusing frontend deploy" >&2; exit 1; }

      - name: Deploy frontend, wait for actual deployment success
        run: bash .github/scripts/coolify-deploy.sh "${{ secrets.COOLIFY_FRONTEND_APP_UUID }}"

  deploy-admin:
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    env:
      COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy admin, wait for actual deployment success
        run: bash .github/scripts/coolify-deploy.sh "${{ secrets.COOLIFY_ADMIN_APP_UUID }}"
