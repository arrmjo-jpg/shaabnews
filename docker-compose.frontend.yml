# ── shaabnews-frontend — independent Coolify Application ────────────────────────────────────────
#
# BUILD_API_BASE_URL and API_BASE_URL are now the SAME public URL for build-time *and* runtime
# (decision confirmed after the Phase A/B/C review): once `shaabnews-backend` is its own
# independently-deployed, always-up Application, the only requirement is that it be healthy
# *before this Application's build starts* — a deployment-ordering problem (see
# .github/workflows/deploy.yml), not a Docker networking problem. This removes the
# host.docker.internal / BACKEND_HOST_BIND / extra_hosts workaround entirely — that whole
# mechanism existed only to reach a backend on the SAME docker-compose project from inside
# BuildKit's network-isolated builder, which no longer applies once backend is a fully separate,
# independently-reachable-over-HTTPS Application.
#
# Domain below is a LITERAL string, not ${FRONTEND_DOMAIN} — confirmed live (Phase F, 2026-08-09)
# that Coolify does not interpolate variables inside `labels:` (see docker-compose.backend.yml's
# header comment for the full evidence/explanation). Currently set to the migration-testing
# domain; cutover swaps it to harer.store via a small Git diff, not an env var change. Do not set
# a "Domain" in Coolify's own UI for this Application either — keep it purely on manual labels for
# consistency with backend/admin, even though frontend only has one Traefik service (so Coolify's
# auto-domain wouldn't hit the same multi-service error backend did — still avoided for uniformity).

services:
  frontend:
    image: alphacms-frontend:${CLIENT:-shaabjo}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        CLIENT: ${CLIENT:-shaabjo}
        BUILD_API_BASE_URL: ${BUILD_API_BASE_URL:?BUILD_API_BASE_URL is required — the backend's public URL, e.g. https://api.harer.store}
        SITE_URL: ${SITE_URL:?SITE_URL is required}
      secrets:
        - openweather_api_key
        - internal_api_token
    restart: unless-stopped
    environment:
      API_BASE_URL: ${API_BASE_URL:?API_BASE_URL is required — must equal BUILD_API_BASE_URL, see frontend/scripts/build-gate-config.mjs}
      SITE_URL: ${SITE_URL:?SITE_URL is required}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?REVALIDATE_SECRET is required — must equal backend's FRONTEND_REVALIDATE_SECRET exactly}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
    volumes:
      - frontend-cache:/app/.next/cache
    expose:
      - "3000"
    # 127.0.0.1 لا $HOSTNAME: صيغة CMD (exec مباشر) لا تستدعي أي شِل — مؤكَّد حيًّا (Phase F،
    # 2026-08-09) أن $HOSTNAME كان يصل حرفيًا بعلامة الدولار (`wget: bad address '$HOSTNAME:3000'`)
    # فيفشل الفحص دومًا رغم أن التطبيق نفسه سليم، وTraefik يرفض التوجيه لحاوية "unhealthy" (503).
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=Host(`new.harer.store`)
      - traefik.http.routers.frontend.entrypoints=https
      - traefik.http.routers.frontend.tls=true
      - traefik.http.routers.frontend.tls.certresolver=letsencrypt
      - traefik.http.services.frontend.loadbalancer.server.port=3000

volumes:
  frontend-cache:

secrets:
  openweather_api_key:
    environment: OPENWEATHER_API_KEY
  internal_api_token:
    environment: INTERNAL_API_TOKEN
