# ── shaabnews-backend — independent Coolify Application ────────────────────────────────────────
#
# Split out of the former single docker-compose.yml (Phase A/B/C investigation, see
# docs/architecture — architectural split to stop worker restart-loops and frontend build
# failures from taking down the whole stack together). This Application owns ONLY the Laravel
# API (php-fpm + nginx via docker/php/supervisord.conf, unchanged). Workers/scheduler live in
# docker-compose.workers.yml as a separate Application — see that file for why.
#
# Domains below are LITERAL strings, not ${VAR} placeholders — confirmed live (Phase F, 2026-08-09)
# that Coolify does NOT interpolate environment variables inside a compose file's `labels:` block:
# `docker exec <container> env` showed BACKEND_DOMAIN/FRONTEND_DOMAIN correctly injected into the
# container's actual runtime environment, but `docker inspect`'s Labels still held the raw
# unresolved `${BACKEND_DOMAIN:?...}` text — Coolify passes `labels:` through as opaque strings,
# unlike `environment:`/`build.args:` which it does resolve. This matches the original unified
# docker-compose.yml's own proven-working pattern (literal `Host(\`harer.store\`)`, no variables)
# — restored here after the variable-based attempt above failed a live deploy test.
#
# Also do NOT set a "Domain" in Coolify's own UI for this Application: its own automatic
# FQDN-to-router generation errored live ("cannot be linked automatically with multiple
# Services: [backend public-storage]") because this file defines two separate Traefik services
# on one container — Coolify's auto-domain mechanism assumes exactly one. Manual labels only.
#
# Currently set to migration-testing domains (api-new.harer.store / new.harer.store) while the
# OLD unified Application still serves the real api.harer.store — cutover is a small, deliberate
# Git diff (swap the literal domains below to the production ones), not an env var flip.

services:
  backend:
    image: alphacms-backend:latest
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ${STORAGE_PUBLIC_HOST_PATH:-/data/storage-public}:/var/www/html/storage/app/public:rw
      - ${UPLOADS_HOST_PATH:-/data/uploads}:/var/www/html/public/uploads:rw
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - traefik.enable=true
      - traefik.http.routers.backend.rule=Host(`api.shaabjo.com`)
      - traefik.http.routers.backend.entrypoints=https
      - traefik.http.routers.backend.tls=true
      - traefik.http.routers.backend.tls.certresolver=letsencrypt
      # صريح إلزامي: هذه الحاوية تعرّف خدمتَي Traefik (backend وpublic-storage)، فـTraefik يرفض
      # ربط أي راوتر منهما تلقائيًا بأي خدمة (يرفض التخمين بين الاثنتين) بلا `service=` صريح على
      # كل راوتر — مؤكَّد حيًّا: "Router backend cannot be linked automatically with multiple
      # Services" في سجلات coolify-proxy قبل إضافة هذا السطر.
      - traefik.http.routers.backend.service=backend
      - traefik.http.services.backend.loadbalancer.server.port=80
      # تحويل HTTP→HTTPS يدويّ صريح — سجلات coolify-proxy تُظهر أن زوج http-0/https-0 التلقائي
      # التوليد من Coolify لهذه الحاوية معطَّل منذ 2026-08-09 لنفس سبب الراوترات أعلاه بالضبط
      # ("cannot be linked automatically with multiple Services")، دون أن يخضع لتصحيح `service=`
      # اليدوي لأنه خارج هذا الملف كليًّا — فحص http://api.shaabjo.com كان يرجع 404 بدل تحويل.
      # `service=` هنا إلزاميّ لنفس السبب الموثَّق أعلاه لراوتر `backend` (خدمتان في هذه الحاوية).
      # `redirect-to-https` middleware مُعرَّف عالميًّا في إعدادات Coolify (مؤكَّد حيًّا، انظر
      # نفس الملاحظة في docker-compose.frontend.yml) — لا حاجة لإعادة تعريفه.
      - traefik.http.routers.backend-http.rule=Host(`api.shaabjo.com`)
      - traefik.http.routers.backend-http.entrypoints=http
      - traefik.http.routers.backend-http.middlewares=redirect-to-https
      - traefik.http.routers.backend-http.service=backend
      # نفس راوتر public-storage الموجود سابقًا في docker-compose.yml الموحَّد — يخدم /storage من
      # nginx الخاص بـbackend مباشرة على دومين الـFRONTEND العام (لا دومين الـbackend نفسه) — قيد
      # قائم من قبل الانقسام، لا شيء جديد أضافه هذا الملف. القيمة هنا يجب أن تطابق frontend's
      # الدومين الفعلي دومًا (docker-compose.frontend.yml) — كلاهما يُحدَّثان معًا عند cutover.
      - traefik.http.routers.public-storage.rule=Host(`shaabjo.com`) && PathPrefix(`/storage`)
      - traefik.http.routers.public-storage.entrypoints=https
      - traefik.http.routers.public-storage.tls=true
      - traefik.http.routers.public-storage.tls.certresolver=letsencrypt
      - traefik.http.routers.public-storage.priority=100
      - traefik.http.routers.public-storage.service=public-storage
      - traefik.http.services.public-storage.loadbalancer.server.port=80

# مؤكَّد حيًّا (Phase F، 2026-08-09): MySQL (hdgwlw3u51qago2q117ll8zj) وRedis
# (bpj18n7r1br3ufuglnsd8z0m) موردا Coolify Standalone Database فعليان، متصلان بشبكة `coolify`
# المشتركة — accessible من هذا الـApplication عبر connect_to_docker_network=true (مفعَّل). القيم
# الفعلية لـDB_HOST/REDIS_HOST/MEILISEARCH_HOST تصل عبر متغيرات بيئة Coolify (نُسخت من shaabnews
# القديم)، مؤكَّدة مطابقة من قِبل المستخدم عبر واجهة Coolify مباشرة (لا فكّ تشفير من طرف الوكيل).
