global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "mysql"
    static_configs:
      - targets: ["mysqld-exporter:9104"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]

  # اختياري: إن ثُبِّت laravel/pulse مع مُصدِّر Prometheus مخصّص، أو إن
  # أُضيف route بسيط يُصدِّر مقاييس php-fpm بصيغة Prometheus (مثال:
  # https://github.com/hipages/php-fpm_exporter كحاوية إضافية):
  # - job_name: "php-fpm"
  #   static_configs:
  #     - targets: ["php-fpm-exporter:9253"]
