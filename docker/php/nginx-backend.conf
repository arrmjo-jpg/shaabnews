# FORCE_REBUILD_CACHE_KEY: 2026-07-02-V2
# ── AlphaCMS API edge (nginx → php-fpm FastCGI) ────────────────────────────────
# php-fpm (127.0.0.1:9000) يتكلّم FastCGI لا HTTP. Traefik/Coolify يوجّه api.<domain> إلى هذه
# الخدمة على المنفذ 80، وتُترجم كلّ طلب HTTP إلى FastCGI عبر public/index.php. الموقع العامّ
# (Next.js) يُخدَم مباشرةً من Traefik → frontend:3000 (لا يمرّ من هنا). TLS يُنهى عند الحافة.

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 512M;          # رفع وسائط الإدارة (فيديو/صور)

    # ضغط استجابات الـ API (JSON نصّي بالكامل تقريباً) — لم يكن مفعّلاً إطلاقاً سابقاً
    # (تأكَّد بالقياس: لا Content-Encoding في أي استجابة رغم Accept-Encoding: gzip).
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types application/json application/javascript text/javascript text/css text/plain application/xml text/xml application/rss+xml image/svg+xml;

    # الوسائط المرفوعة (قرص 'public' المحلّيّ) — تُخدَم من المجلد المشترك مباشرةً.
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # مجلد الرفع المشترك (uploads) — يُخدَم مباشرة من المجلد المرفق.
    location /uploads/ {
        root /var/www/html/public;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # صفحة حالة php-fpm التشخيصية — localhost فقط، مؤقتة لقياس pm.max_children تحت الحمل.
    location = /fpm-status {
        access_log off;
        allow 127.0.0.1;
        deny all;
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # كلّ ما عداها → موجّه Laravel الأماميّ عبر FastCGI على php-fpm.
    location / {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        include fastcgi_params;
        # ROOT CAUSE FIX (تنزيل ملفات الجريدة الرقمية PDF يفشل بـ403 محليًا): fastcgi_params
        # الافتراضي (منذ تصحيح أمنيّ في نسخ nginx الحديثة) يمرّر HTTP_HOST=$host، الذي يُسقِط
        # رقم المنفذ من ترويسة Host (بخلاف $http_host الذي يحتفظ به). محليًا فقط docker-
        # compose.override.yml ينشر هذه الخدمة على منفذ غير قياسي (8080:80 — راجع "ports:" تحت
        # backend/admin هناك)، فحين يوقّع Laravel رابطاً مؤقّتاً (EpaperDocumentDelivery::mint،
        # forceRootUrl يتضمّن ":8080") ثم يتحقّق منه لاحقاً بطلب منفصل، يعيد بناء الرابط "الحاليّ"
        # من Host الوارد فعليًا — إسقاط المنفذ يجعل الرابطين غير متطابقين ⇒ InvalidSignatureException
        # (403) رغم توقيع صحيح تمامًا. الإصلاح: استرجاع المنفذ بعد include عبر $http_host. آمن
        # للإنتاج (المنفذ 443 ضمنيّ في Host أصلاً، لا فرق بين $host/$http_host هناك) — يُصلح محليًا
        # فقط، ولا يُعيد ثغرة انتحال Host: الخدمة هنا غير مكشوفة للإنترنت أبداً (expose: لا ports:
        # في docker-compose.yml الإنتاجي — Traefik هو الحافة الوحيدة، ومحليًا 8080 مقصورة على
        # الجهاز/الشبكة المحليّة لا الإنترنت العام).
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param HTTP_PROXY "";    # تخفيف httpoxy
        fastcgi_read_timeout 120s;
    }
}
