[www]
pm = dynamic

pm.max_children = 30
pm.start_servers = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 12
pm.max_requests = 500

; Temporary diagnostic status page (localhost-only, see nginx-backend.conf) — used to verify
; pm.max_children=30 is actually sufficient under load (max children reached / listen queue).
pm.status_path = /fpm-status