[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[program:queue-worker]
command=php artisan queue:work redis --queue=default,notifications-high,notifications,notifications-low,mail,search,sitemap,ai,analytics,whatsapp,cdn-purge,vertix,migration --tries=3 --backoff=10 --sleep=1 --max-time=3600
directory=/var/www/html
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; خروج طبيعي بعد --max-time=3600 (أيّ رمز خروج) يُعاد تشغيله دائمًا هنا — Docker RestartCount
; يبقى 0 لأنّ supervisord نفسه (PID 1) لا يخرج أبدًا. الخروج بعد أكثر من startsecs من التشغيل
; لا يُحسَب ضمن startretries (سلوك supervisord الافتراضي) — فإعادة التدوير الساعية الطبيعية لا
; تستنفد المحاولات أبدًا. Crash سريع متكرر (خروج قبل انقضاء startsecs، أكثر من startretries
; مرات متتالية) ينقل البرنامج لحالة FATAL؛ عندها [eventlistener:fatal-exit] أدناه يُنهي
; supervisord نفسه عمدًا لتخرج الحاوية كلها ويظهر العطل الحقيقي لـDocker/Coolify — لا يُترَك
; العامل ميتًا بصمت للأبد.
autorestart=true
startsecs=10
startretries=3
priority=5
stopsignal=TERM
stopwaitsecs=900
stopasgroup=true
killasgroup=true

[eventlistener:fatal-exit]
command=python3 /usr/local/bin/supervisor-fatal-exit.py
events=PROCESS_STATE_FATAL
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
