[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[program:scheduler]
command=php artisan schedule:work
directory=/var/www/html
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; schedule:work عملية طويلة الأمد لا تخرج دوريًا مثل queue:work --max-time — فهي أصلاً لا تعاني
; من مشكلة العدّ التي دفعت هذا التصميم. إدراجها هنا هو من أجل الاتساق (نمط واحد للأدوار الثلاثة)
; لا لأنها كانت مصدر أي عطل ملاحَظ سابقًا.
autorestart=true
startsecs=5
startretries=3
priority=5
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true

[eventlistener:fatal-exit]
command=python3 /usr/local/bin/supervisor-fatal-exit.py
events=PROCESS_STATE_FATAL
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
