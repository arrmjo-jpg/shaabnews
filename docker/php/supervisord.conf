[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[program:php-fpm]
command=php-fpm -F
user=root
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=5
; SIGQUIT = php-fpm's graceful shutdown (finish in-flight requests, then exit);
; the default SIGTERM is harsher. stopwaitsecs gives it time to actually drain
; before supervisord escalates to SIGKILL.
stopsignal=QUIT
stopwaitsecs=30

[program:nginx]
command=nginx -g "daemon off;"
user=root
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=10
; SIGQUIT = nginx's graceful shutdown (workers finish current requests, then
; exit); the default SIGTERM is nginx's *fast* shutdown and drops connections
; immediately. stopwaitsecs gives it time to actually drain.
stopsignal=QUIT
stopwaitsecs=30
