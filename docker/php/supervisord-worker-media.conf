[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[program:queue-worker-media]
command=php artisan queue:work redis-media --queue=media --tries=2 --timeout=2520 --sleep=2 --max-time=3600
directory=/var/www/html
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; نفس منطق supervisord-worker.conf — انظر تعليقه للتفاصيل الكاملة عن autorestart/FATAL/RestartCount.
autorestart=true
startsecs=10
startretries=3
priority=5
stopsignal=TERM
stopwaitsecs=2520
; حرجة هنا تحديدًا: queue:work يُطلق ffmpeg كعملية ابنة أثناء الترميز. بلا stopasgroup/killasgroup
; قد يُنهي SIGTERM عملية PHP الأمّ ويترك ffmpeg يتيمة تكتب ملفًا جزئيًا، أو تنتهي مهلة supervisord
; وتُقتَل PHP بينما ffmpeg لا يزال يعمل. كلاهما True يضمن وصول الإشارة لمجموعة العمليات كاملة.
stopasgroup=true
killasgroup=true

[eventlistener:fatal-exit]
command=python3 /usr/local/bin/supervisor-fatal-exit.py
events=PROCESS_STATE_FATAL
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
